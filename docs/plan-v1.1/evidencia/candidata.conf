# Configuración CANDIDATA para la Fase 3 — escrita a mano para el experimento
# `diseno-candidato.mjs` (petición/respuesta).
#
# La ACL de la Fase 1 ya no está aquí: la genera `scripts/gen-acl.mjs` y la ejecuta
# `conformance/security.mjs` (casos S1–S14). Tampoco la de estado (Fase 2): son los usuarios
# `crm`, `tienda`, `tienda-info` y `tienda-dev` de `acls.estado` en
# `conformance/cases/state-broker.json`, que ejecuta `conformance/state-broker.mjs`. Queda solo
# lo que el generador aún no cubre:
#   · petición/respuesta: `allow_responses` para quien atiende y permiso de llamada exacto
#     (Fase 3, clave `calls`)
# Con inbox PRIVADO por servicio (`_INBOX.<servicio>.>`).
#
# user/password solo porque es un experimento: en producción es nkey o JWT.

port: 4234
jetstream { store_dir: "__STORE__" }

accounts {
  PROD: {
    jetstream: enabled
    users: [
      # Operación: sin restricciones. Hace de IaC en el experimento.
      { user: "ops", password: "pw" },

      # No es dueño de `clientes`: llama a su operación `obtener` y no puede escribir su estado.
      { user: "fx-fact", password: "pw", permissions: {
          publish: { allow: ["rpc.clientes.cliente.v1.obtener"] }
          subscribe: { allow: ["_INBOX.fx-fact.>"] }
      } },

      # No tiene concedido nada ajeno. Es el que intenta llamar a lo que no es suyo.
      { user: "fx-chis", password: "pw", permissions: {
          publish: { allow: ["chismes.>"] }
          subscribe: { allow: ["_INBOX.fx-chis.>"] }
      } },

      # Dueño de `clientes`: atiende sus peticiones.
      { user: "fx-clientes", password: "pw", permissions: {
          publish: { allow: ["clientes.>"] }
          subscribe: { allow: ["_INBOX.fx-clientes.>", "rpc.clientes.>"] }
          allow_responses: true
      } }
    ]
  }
}
