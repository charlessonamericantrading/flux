# Configuración CANDIDATA para la Fase 1 — escrita a mano para el experimento.
# `scripts/gen-acl.mjs` v2 debe llegar a generar exactamente esta forma.
#
# Diferencias con la ACL que se genera hoy:
#   · inbox PRIVADO por servicio (`_INBOX.<servicio>.>`), no `_INBOX.>` común
#   · permisos EXACTOS sobre `$JS.API.*` y `$JS.ACK.*`, uno por consumidor durable
#   · ningún permiso de suscripción sobre subjects de dominio: los SDKs consumen por pull
#   · `allow_responses` para quien atiende peticiones (Fase 3)
#
# user/password solo porque es un experimento: en producción es nkey o JWT.

port: 4234
jetstream { store_dir: "__STORE__" }

accounts {
  PROD: {
    jetstream: enabled
    users: [
      # Operación: sin restricciones. Hace de IaC en el experimento.
      { user: "ops", password: "pw" },

      # Consume pedidos.pedido.v1.creado y llama a rpc.clientes.cliente.v1.obtener.
      { user: "fx-fact", password: "pw", permissions: {
          publish: { allow: [
            "facturacion.>",
            "dlq.pedidos.pedido.v1.creado",
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.EVT_PEDIDOS",
            "$JS.API.STREAM.INFO.EVT_FACTURACION",
            "$JS.API.CONSUMER.INFO.EVT_PEDIDOS.fx-fact__pedidos_pedido_v1_creado",
            "$JS.API.CONSUMER.CREATE.EVT_PEDIDOS.fx-fact__pedidos_pedido_v1_creado.pedidos.pedido.v1.creado",
            "$JS.API.CONSUMER.MSG.NEXT.EVT_PEDIDOS.fx-fact__pedidos_pedido_v1_creado",
            "$JS.ACK.EVT_PEDIDOS.fx-fact__pedidos_pedido_v1_creado.>",
            "rpc.clientes.cliente.v1.obtener"
          ] }
          subscribe: { allow: ["_INBOX.fx-fact.>"] }
      } },

      # No tiene concedido nada ajeno. Es el que intenta espiar.
      { user: "fx-chis", password: "pw", permissions: {
          publish: { allow: ["chismes.>", "$JS.API.INFO"] }
          subscribe: { allow: ["_INBOX.fx-chis.>"] }
      } },

      # Observa el estado de `clientes`, pero SOLO del tenant `acme` (Fase 2).
      { user: "fx-web", password: "pw", permissions: {
          publish: { allow: [
            "$JS.API.INFO",
            "$JS.API.CONSUMER.CREATE.STATE_CLIENTES.fx-web__state_clientes_cliente_v1__acme.state.clientes.cliente.v1.acme.*",
            "$JS.API.CONSUMER.INFO.STATE_CLIENTES.fx-web__state_clientes_cliente_v1__acme",
            "$JS.API.CONSUMER.MSG.NEXT.STATE_CLIENTES.fx-web__state_clientes_cliente_v1__acme",
            "$JS.ACK.STATE_CLIENTES.fx-web__state_clientes_cliente_v1__acme.>",
            "$JS.API.DIRECT.GET.STATE_CLIENTES.state.clientes.cliente.v1.acme.*"
          ] }
          subscribe: { allow: ["_INBOX.fx-web.>"] }
      } },

      # Dueño de `clientes`: escribe su estado y atiende sus peticiones.
      { user: "fx-clientes", password: "pw", permissions: {
          publish: { allow: ["clientes.>", "state.clientes.>"] }
          subscribe: { allow: ["_INBOX.fx-clientes.>", "rpc.clientes.>"] }
          allow_responses: true
      } }
    ]
  }
}
