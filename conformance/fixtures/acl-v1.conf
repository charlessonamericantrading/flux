# ═══════════════════════════════════════════════════════════════════════════════
# ACL v1 — CONGELADA Y ROTA A PROPÓSITO. NO LA USES. NO LA ARREGLES. NO LA REGENERES.
# ═══════════════════════════════════════════════════════════════════════════════
#
# Esto es lo que `scripts/gen-acl.mjs` generaba ANTES de la Fase 1 del plan v1.1
# (commit a4db4b8), a partir de `examples/services.json`. Existe como fixture de
# REGRESIÓN (caso S9 de la suite de seguridad): demuestra que los dos fallos de
# docs/plan-v1.1/PLAN.md §3 son reales y que un generador nuevo no los reintroduce.
#
#   H1  No concede NADA sobre `$JS.API.*`. JetStream se consume por ahí, así que un
#       servicio no puede ni consultar su stream, ni crear su consumidor, ni consumir.
#       (Apéndice A-1: Permissions Violation for Publish to "$JS.API.STREAM.INFO.…")
#   H2  Concede `_INBOX.>`, común a todos los servicios. Las entregas de un pull
#       consumer viajan por el inbox, así que cualquier servicio lee lo que reciba otro
#       aunque no tenga concedido su dominio. (Apéndice A-2: `facturacion-api` leyó un
#       evento de `inventario`.)
#
# Si un día esta ACL "funciona" contra un NATS real, el fixture ha dejado de ser lo que
# dice ser (o el servidor ha cambiado de semántica): la suite DEBE fallar, no adaptarse.
#
# Cómo se obtuvo, para poder auditarlo (con el generador tal y como estaba en a4db4b8):
#
#     node scripts/gen-acl.mjs examples/services.json
#
# ÚNICA diferencia con esa salida, aparte de esta cabecera: cada
#     nkey: "<NKEY_DE_PEDIDOS_API>"
# se ha sustituido por
#     user: "pedidos-api", password: "pw"
# (el nombre del servicio, en minúsculas y kebab-case). Un placeholder `<NKEY_DE_…>`
# no es una clave válida y el servidor se negaría a cargar el fichero; con usuario y
# contraseña de prueba se puede cargar tal cual, sin generar claves. `pw` NO es un
# secreto: este fichero solo se usa contra servidores efímeros de test.
#
# Los permisos de cada servicio —lo único que importa aquí— son, byte a byte, los que
# generó entonces el generador. No incluye ningún usuario de operación: quien lo use
# para aprovisionar debe añadir uno, p. ej. insertando tras la línea `users: [`
#     { user: "ops", password: "pw" },
#
# Es un bloque `accounts { … }` incluible con `include`; no define puerto ni JetStream
# de servidor (eso lo pone la configuración que lo incluye).
# ═══════════════════════════════════════════════════════════════════════════════

# GENERADO por scripts/gen-acl.mjs — no editar a mano.
# Entorno: produccion
# Fuente:  examples/services.json
#
# Regla aplicada (06-security.md §3): un servicio solo publica en el dominio del
# que es dueño, y solo se suscribe a lo que se le concede explícitamente. Esto
# convierte el ownership del dato en algo que aplica el BROKER: un servicio no
# puede falsificar un evento de otro dominio aunque su código lo intente.

accounts {
  PRODUCCION: {
    jetstream: enabled
    users: [

      # pedidos-api
      #   dueño de: pedidos
      #   consume: inventario.stock.v1.>
      {
        user: "pedidos-api", password: "pw"
        permissions: {
          publish:   { allow: ["pedidos.>", "dlq.inventario.stock.v1.>"] }
          subscribe: { allow: ["inventario.stock.v1.>", "dlq.pedidos.>", "_INBOX.>"] }
        }
      },

      # facturacion-api
      #   dueño de: facturacion
      #   consume: pedidos.pedido.v1.>
      {
        user: "facturacion-api", password: "pw"
        permissions: {
          publish:   { allow: ["facturacion.>", "dlq.pedidos.pedido.v1.>"] }
          subscribe: { allow: ["pedidos.pedido.v1.>", "dlq.facturacion.>", "_INBOX.>"] }
        }
      },

      # inventario-api
      #   dueño de: inventario
      #   consume: pedidos.pedido.v1.>
      {
        user: "inventario-api", password: "pw"
        permissions: {
          publish:   { allow: ["inventario.>", "dlq.pedidos.pedido.v1.>"] }
          subscribe: { allow: ["pedidos.pedido.v1.>", "dlq.inventario.>", "_INBOX.>"] }
        }
      },

      # logistica-api
      #   dueño de: logistica
      #   consume: pedidos.pedido.v1.>, facturacion.factura.v2.>
      {
        user: "logistica-api", password: "pw"
        permissions: {
          publish:   { allow: ["logistica.>", "dlq.pedidos.pedido.v1.>", "dlq.facturacion.factura.v2.>"] }
          subscribe: { allow: ["pedidos.pedido.v1.>", "facturacion.factura.v2.>", "dlq.logistica.>", "_INBOX.>"] }
        }
      },
    ]
  }
}

# Las credenciales NUNCA se versionan (06-security.md §2): sustituye cada
# <NKEY_DE_*> desde el gestor de secretos al desplegar.
