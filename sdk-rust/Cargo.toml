[package]
name = "flux"
version = "1.0.0"
edition = "2021"
# 1.83 es el mínimo real: `io::ErrorKind::{HostUnreachable, NetworkUnreachable}` —que
# `classify.rs` usa para reconocer lo transitorio por SEMÁNTICA y no por substring— se
# estabilizaron ahí (`io_error_more`).
rust-version = "1.83"
description = "Cliente Rust del flux Event Protocol v1 — CloudEvents 1.0 sobre NATS JetStream (L2)"
license = "MIT"
repository = "https://github.com/charlessonamericantrading/flux"
readme = "README.md"
keywords = ["cloudevents", "nats", "jetstream", "eventos", "flux"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# `preserve_order` mantiene el orden de inserción de las claves de un serde_json::Map.
# Sin él, un `data` construido con json!({...}) se reordenaría alfabéticamente al
# serializar y dejaría de ser byte a byte el mismo — 01-envelope.md §6.
#
# `raw_value` habilita Box<RawValue>, el equivalente de json.RawMessage de Go: el
# payload viaja sin interpretar, así que un evento parseado y vuelto a serializar
# conserva orden de claves Y fidelidad numérica (4995.00 no se convierte en 4995.0)
# — 01-envelope.md §2.5.
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde = { version = "1.0", features = ["derive"] }

# UUIDv7: monotónico en el tiempo — 01-envelope.md §2.6.
uuid = { version = "1", features = ["v7"] }

# chrono y no std::time: `time` exige EXACTAMENTE 3 decimales y sufijo Z, y eso hay
# que formatearlo explícitamente — 01-envelope.md §2.2.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

thiserror = "2"

tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures = "0.3"

async-nats = "0.50"

# ─── Firma Ed25519 — extensión OPCIONAL de v1 (07-signing.md) ────────────────
#
# Va detrás de la feature `signing` y NO se activa por defecto a propósito: la firma es
# una extensión opcional del protocolo (un evento sin firma sigue siendo válido), así que
# imponer curve25519-dalek al árbol de dependencias de TODO servicio del ecosistema —con
# su tiempo de compilación y su superficie de auditoría— por algo que la mayoría no usa
# sería cobrar a todos por lo que usan unos pocos.
#
# `rand_core` solo lo necesita `generate_key_pair`, que es comodidad para tests y para
# `flux keygen`; firmar y verificar no consumen aleatoriedad (Ed25519 es determinista, y
# de ahí que la firma de un mismo evento sea siempre la misma — 07-signing.md §2).
ed25519-dalek = { version = "2.2", features = ["rand_core"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

# ─── Validación L3 — opt-in (00-protocol.md §5) ──────────────────────────────
#
# Mismo trato que `signing` y por el mismo motivo: L3 es opt-in, así que su coste también
# debe serlo. Un servicio en L2 no tiene por qué arrastrar un validador de JSON Schema que
# no va a ejecutar nunca, y `cargo build` sin features tiene que seguir funcionando.
#
# `default-features = false` NO es una optimización: las features por defecto del crate son
# `resolve-http` + `resolve-file` + TLS, es decir, `reqwest` y `rustls` en el árbol de
# dependencias para ir a buscar `$ref`s por red. Un SDK L3 **NO DEBE** resolver el
# `dataschema` por HTTP —está en la ruta caliente, y una caché con TTL abre una ventana en
# la que dos servicios validan contra versiones distintas del mismo esquema—, así que apagar
# esa resolución es exactamente lo que manda el protocolo. El bundle llega como dato y es
# autocontenido.
#
# Versión 0.46 y no la 0.50: la 0.50 sube el MSRV por encima del 1.83 que este crate declara,
# y subirlo obligaría a actualizar el toolchain de todo servicio que consuma el SDK por una
# feature que la mayoría no activa. La 0.46 entiende draft 2020-12, que es lo único que hace
# falta aquí.
jsonschema = { version = "0.46", default-features = false, optional = true }

[features]
default = []
signing = ["dep:ed25519-dalek", "dep:rand_core"]
validation = ["dep:jsonschema"]

# ─── Arnés de conformidad cruzada ────────────────────────────────────────────
#
# El programa que `conformance/cross-sdk.mjs` invoca para comparar los bytes de este SDK
# con los de los otros seis — conformance/harness/README.md.
#
# `required-features = ["signing"]` porque el contrato incluye las operaciones `sign` y
# `verify`, y la firma vive detrás de esa feature. Declararlo así hace que
# `cargo build`/`cargo test` sin features simplemente SALTEN el binario, en vez de fallar
# a mitad de compilación con un `unresolved import flux::signing`.
[[bin]]
name = "conformance-harness"
path = "src/bin/conformance-harness.rs"
required-features = ["signing"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Los tests de integración leen la DLQ con la API CRUDA de NATS a propósito: comprueban
# los BYTES que el SDK escribió, no su propia interpretación de ellos.
async-nats = "0.50"
