name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-valido:
    name: El propio workflow es válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      # Una clave duplicada rompe el workflow ENTERO y GitHub no ejecuta ni un job, así
      # que este trabajo solo sirve en el PR: para cuando llega a main, el daño ya está
      # hecho. Su valor real es local, antes de commitear.
      - run: python scripts/check-workflow.py

  llms-up-to-date:
    name: llms-full.txt al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin esto, llms-full.txt diverge de specification/ en la primera semana,
      # y un agente que carga documentación obsoleta actúa con confianza sobre
      # reglas que ya no existen — peor que no cargar ninguna.
      - name: Verificar que el agregado está regenerado
        run: node scripts/build-llms.mjs --check

  schemas-valid:
    name: Schemas válidos e inmutables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 05-compatibility.md §5: "Sin (1) y (2) automatizados, el resto de este
      # documento es una sugerencia amable." Esto es (1) y (2).
      - name: Esquemas conformes y BACKWARD-compatibles
        run: node scripts/check-compat.mjs -v

      # El bundle es lo que los servicios L3 despliegan: si diverge de schemas/,
      # un servicio valida contra un contrato que ya no existe.
      - name: bundle.json al día
        run: node scripts/bundle-schemas.mjs --check

      # Una comprobación que solo se ha visto en verde no demuestra nada: esto escribe esquemas rpc ROTOS (una
      # petición sin su respuesta, un data que no es un objeto…) en una copia y exige que cada uno falle por su razón,
      # y que la compatibilidad se invierta donde toca (11-request-reply.md §11).
      - name: Las herramientas de esquemas detectan lo roto (en negativo)
        run: node scripts/test-schema-tools.mjs

      # 05-compatibility.md §4: los esquemas publicados son inmutables.
      # Editar 1.0.0 in situ invalida todos los eventos ya emitidos que lo referencian.
      #
      # `schemas/bundle.json` se EXCLUYE: no es un esquema publicado sino un índice GENERADO, y
      # añadir cualquier esquema lo regenera (su estado en el diff es `M`). Sin la exclusión,
      # este paso fallaba en todo PR que añadiera un esquema, aunque solo hubiera adiciones.
      - name: Ningún schema existente modificado
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status \
            origin/${{ github.base_ref }}...HEAD -- schemas/ ':(exclude)schemas/bundle.json' \
            | awk '$1 == "M" || $1 ~ /^R/ { print $2 }')
          if [ -n "$changed" ]; then
            echo "✗ Schemas publicados modificados (son inmutables — añade una versión nueva):"
            echo "$changed"
            exit 1
          fi
          echo "✓ Solo adiciones"

  acl-manifest:
    name: Manifiesto de ownership coherente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Un dominio con dos dueños destruye la premisa de que solo el propietario
      # del agregado publica sus eventos, y nadie puede confiar ya en el .
      - run: node scripts/gen-acl.mjs examples/services.json --check

  acl-verify:
    name: ACLs generadas, contra un NATS real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # nats-server 2.14.5 exige Go 1.25 (su go.mod). Sin Docker y sin descargar un binario
      # de origen dudoso: se compila la versión exacta que la spec dice haber medido.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      # Las dependencias de NATS las usan la suite (conformance/) y la CLI (cli/, para
      # `flux provision`); verify-acl no añade ninguna.
      - run: npm install --no-audit --no-fund
        working-directory: conformance
      - run: npm install --no-audit --no-fund
        working-directory: cli
      # H3 del plan v1.1: hasta ahora nada aplicaba los permisos generados a un broker, y por
      # eso «funcionaban» en el papel mientras un servicio no podía consumir (H1) y leía
      # dominios ajenos (H2). Termina con exit 0 solo si lo permitido funciona, lo denegado se
      # deniega, cada permiso es necesario y las sondas DETECTAN una ACL rota.
      - name: Aplicar las ACLs generadas a un nats-server real
        run: node scripts/verify-acl.mjs

  # La suite de seguridad (Fase 1.5): los casos son DATOS (conformance/cases/security-acl.json) y
  # el runner los ejecuta contra un nats-server con TLS, con la ACL que genera gen-acl.mjs y con
  # los SDKs de Node y de Rust de verdad. `acl-verify`, arriba, NO es redundante con ella: verifica
  # el generador (sus errores y --nkeys), `flux provision`, la minimalidad de cada permiso, --dev y
  # el Modelo B; esta verifica el contrato de seguridad de extremo a extremo.
  security:
    name: Suite de seguridad — ACLs, TLS y SDKs contra un NATS real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # nats-server 2.14.5 exige Go 1.25 (su go.mod): se compila la versión exacta que los casos
      # dicen haber medido, igual que en `acl-verify`.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      # S11 compila y lanza `cargo run --example acl_cycle` en sdk-rust; S31 y S33, el participante de petición/respuesta
      # (`--example rpc_participant --features signing`).
      - uses: dtolnay/rust-toolchain@stable
      # La suite usa la CLI (`flux provision`) y el SDK de Node (S10, desde dist/).
      - run: npm install --no-audit --no-fund
        working-directory: conformance
      - run: npm install --no-audit --no-fund
        working-directory: cli
      - run: npm install --no-audit --no-fund
        working-directory: sdk-node
      - run: npm run build
        working-directory: sdk-node
      # FLUX_REQUIRE_BROKER=1: la AUSENCIA de nats-server, openssl, sdk-node/dist o cargo es un
      # FALLO y no un salto con aviso. Sin ella, un binario que no se compilara dejaría el job
      # verde sin haber ejecutado nunca los permisos contra un broker: aparentaría cobertura.
      - name: Ejecutar la suite de seguridad
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: node conformance/security.mjs
      # Una prueba que solo se ha visto en verde no demuestra nada: se estropea el GENERADOR de ACL a propósito (`rpc.<dominio>.>` a
      # quien llama, `rpc.>` o un permiso de publicación sobre inboxes al dueño, sin `allow_responses` o sin su `expires`, el inbox
      # común…) y los casos S21 a S29 DEBEN fallar con cada uno de los 13 mutantes. Sin mutar, el subconjunto pasa. (Los casos con
      # SDKs reales, S30 y S34, hacen lo mismo con `--sdk` en el job `interop-rpc`: en paralelo, para no alargar este.)
      - name: Los casos detectan un generador de ACL estropeado (deben FALLAR)
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: node conformance/security/mutantes.mjs
      # El estado replicado (10-state.md): los casos del broker, una ACL por tenant escrita a mano y un
      # cluster de tres nodos. Levanta sus propios servidores con el nats-server compilado arriba.
      - name: Ejecutar la suite de estado replicado
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: node conformance/state-broker.mjs
      # Un caso que solo se ha visto en verde no demuestra nada: con una referencia que solo reconoce
      # el conflicto 10071 (el de un nodo suelto; en un cluster es el 10164) el runner DEBE fallar.
      - name: Los casos detectan un put que solo reconoce el 10071 (debe FALLAR)
        run: |
          if node conformance/state-broker.mjs --mutant only-10071 > /dev/null 2>&1; then
            echo "✗ el mutante only-10071 NO hizo fallar la suite: el caso de cluster no vigila nada"
            exit 1
          fi
          echo "✓ el mutante fue detectado"
      # La petición/respuesta (11-request-reply.md): los casos medidos contra un broker (un nodo, una ACL a mano y un
      # cluster de tres nodos) y contra `async-nats` por una sonda de Rust, que compila con el cargo de arriba.
      - name: Ejecutar la suite de petición/respuesta
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: node conformance/rpc-broker.mjs
      # Cuatro fallos que los casos DEBEN notar: sin grupo de cola, con una suscripción de comodín, sin allow_responses
      # y con un stream que captura `rpc.>`. Con cualquiera de ellos el runner DEBE fallar.
      - name: Los casos detectan cuatro fallos de configuración (deben FALLAR)
        run: |
          for m in no-queue-group wildcard-subscription no-allow-responses stream-captures-rpc; do
            if node conformance/rpc-broker.mjs --no-rust --no-cluster --mutant "$m" > /dev/null 2>&1; then
              echo "✗ el mutante $m NO hizo fallar la suite: los casos no vigilan lo que dicen"
              exit 1
            fi
            echo "✓ el mutante $m fue detectado"
          done

  # Petición/respuesta entre los SDKs REALES de Node y de Rust (conformance/interop-rpc.mjs): el mismo entorno que la suite de
  # seguridad —nats-server con TLS, la ACL que genera gen-acl.mjs, `flux provision`— y cada instancia, un PROCESO con un SDK de
  # verdad: Node llama a Rust y al revés (y los dos de control), con tenants distintos, firma `require`, errores retryable y
  # permanent, una respuesta que no cabe y un handler que lanza lo desconocido. Va en su propio job para no alargar el de seguridad
  # (~12 min): corre en paralelo. Los S30 a S34 (el ciclo de §12.9 y A-101 con cada SDK) corren en el de seguridad.
  interop-rpc:
    name: Interoperabilidad de petición/respuesta — los SDKs de Node y de Rust contra un NATS real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      # El participante de Rust (`--example rpc_participant --features signing`) lo compila el propio runner.
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
        working-directory: conformance
      - run: npm install --no-audit --no-fund
        working-directory: cli
      - run: npm install --no-audit --no-fund
        working-directory: sdk-node
      - run: npm run build
        working-directory: sdk-node
      - name: Ejecutar la suite de interoperabilidad entre SDKs
        env:
          FLUX_REQUIRE_BROKER: '1'
          FLUX_TEST_PORTS: '4650-4699'
        run: node conformance/interop-rpc.mjs
      # Una prueba que solo se ha visto en verde no demuestra nada: se estropea el SDK a propósito —que abra una suscripción a su
      # inbox por la conexión con la que pide (A-101: `RPC_UNAVAILABLE` pasa a ser un timeout) en `connect()`, en el pull o en el
      # `watch`; una respuesta que no hereda el tenant; que reenvíe el texto de una excepción desconocida; un reintento con otro
      # `id`; un responder que no verifica la firma— y los casos DEBEN fallar con cada uno de los 11 mutantes. Sin mutar, pasan.
      - name: Los casos detectan un SDK estropeado (deben FALLAR)
        env:
          FLUX_REQUIRE_BROKER: '1'
          FLUX_TEST_PORTS: '4650-4699'
        run: node conformance/security/mutantes-sdk.mjs
      # Y al revés: un GENERADOR de ACL estropeado (a quien llama `rpc.<dominio>.>`, sin `allow_responses`, el inbox común, un permiso de
      # publicación sobre inboxes, `max: 3`…) también tiene que romper a los SDKs reales: S30 (el ciclo de §12.9 con el de Node) y
      # S34 (`allow_responses` con un responder tramposo) DEBEN fallar con cada uno de los 11 mutantes.
      - name: Los casos con SDKs reales detectan un generador de ACL estropeado (deben FALLAR)
        env:
          FLUX_REQUIRE_BROKER: '1'
          FLUX_TEST_PORTS: '4650-4699'
        run: node conformance/security/mutantes.mjs --sdk

  protocol-json-valid:
    name: protocol.json coherente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No basta con que sea JSON válido: un patrón con las barras invertidas comidas
      # sigue compilando y rechaza TODO lo que debería aceptar. Pasó de verdad.
      - run: node scripts/check-protocol-json.mjs
      # Cruza `protocol.json` → `capabilities` con el código de cada SDK y con la tabla del
      # README: una capacidad que solo existe en una tabla es una intención. Se autocomprueba
      # con mutaciones (quitar un código de un SDK debe hacerlo fallar).
      - run: node scripts/check-sdk-codes.mjs

  # La CLI (cli/) contra un nats-server real: `flux state ls|get|resync`, `flux doctor` sobre estado,
  # `flux tail` y `flux dlq replay` (que DEBE rechazar `dlq.state.>`). Es el equivalente, para el
  # estado, del paso «flux doctor detecta un cluster roto» del job `conformance`: el doctor se prueba
  # en los dos sentidos (verde con la configuración buena, rojo con cada una de las doce rotas), y
  # la simulación de `resync` no cambia nada mientras `--confirm` sí. Un broker PROPIO por suite en
  # lugar del compartido de `conformance`: ese acaba el job con un cluster roto a propósito.
  cli:
    name: CLI contra NATS real — estado, doctor, tail y dlq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # nats-server 2.14.5 exige Go 1.25 (su go.mod): se compila la versión exacta que la spec dice
      # haber medido, igual que en `acl-verify` y `security`.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
        working-directory: cli
      # FLUX_REQUIRE_BROKER=1: que falte nats-server es un FALLO y no un salto con aviso. Sin ella, un
      # binario que no se compilara dejaría el job verde sin haber ejecutado nunca la CLI contra un broker.
      - name: Pruebas de la CLI (modelo de estado sin broker; ls, get, resync, doctor, tail y dlq con él)
        working-directory: cli
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: npm test
      # En los dos sentidos también aquí: sin broker, las pruebas con broker DEBEN fallar.
      - name: Sin nats-server, las pruebas con broker FALLAN (no se saltan)
        working-directory: cli
        run: |
          if NATS_SERVER=/no/existe/nats-server FLUX_REQUIRE_BROKER=1 npm test > /dev/null 2>&1; then
            echo "✗ las pruebas de la CLI pasaron SIN nats-server con FLUX_REQUIRE_BROKER=1: la comprobación no vigila nada"
            exit 1
          fi
          echo "✓ sin nats-server las pruebas de la CLI fallan"

  sdk-node:
    name: SDK Node — typecheck, tests e integración contra NATS real
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # nats-server 2.14.5 exige Go 1.25 en su go.mod: se fija aquí en vez de depender de
      # que `go` descargue un toolchain por su cuenta. Sin docker, a diferencia del job
      # `conformance`: los tests de integración arrancan su PROPIO servidor, con la config
      # (usuarios, permisos, TLS, modo operador) que cada caso escribe.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/nats-io/nats-server/v2@v2.14.5
          "$GOBIN/nats-server" --version
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # FLUX_REQUIRE_BROKER hace que la AUSENCIA del broker sea un fallo y no un salto con
      # aviso: sin ella, un binario que no se compilara dejaría el CI verde sin haber
      # ejecutado nunca los tests que prueban los permisos.
      - name: Tests (unitarios + integración contra nats-server)
        env:
          NATS_SERVER: ${{ runner.temp }}/bin/nats-server
          FLUX_REQUIRE_BROKER: '1'
        run: npm test
      - run: npm run build

  gateway:
    name: Gateway de borde — extremo a extremo contra NATS real (ACLs generadas) e imagen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Como `cli` y `sdk-node`: se compila la versión EXACTA de nats-server que la spec dice haber medido.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      # El gateway depende del SDK de Node (`file:../sdk-node`, ya compilado), y sus pruebas aplican las ACLs que genera
      # scripts/gen-acl.mjs (dependencias de NATS en `conformance/`) y aprovisionan con `flux provision` (`cli/`).
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: sdk-node
      - run: npm ci --no-audit --no-fund
        working-directory: conformance
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - run: npm ci --no-audit --no-fund
        working-directory: gateway
      # FLUX_REQUIRE_BROKER=1: que falte nats-server es un FALLO y no un salto con aviso.
      - name: Pruebas de extremo a extremo (permisos generados, NATS real, un receptor HTTP que verifica la firma)
        working-directory: gateway
        env:
          FLUX_REQUIRE_BROKER: '1'
          FLUX_TEST_PORTS: 6900-6999
        run: npm test
      - name: Sin nats-server, las pruebas con broker FALLAN (no se saltan)
        working-directory: gateway
        run: |
          if NATS_SERVER=/no/existe/nats-server FLUX_REQUIRE_BROKER=1 node --test --test-force-exit test/e2e-entrada.test.mjs > /dev/null 2>&1; then
            echo "✗ las pruebas del gateway pasaron SIN nats-server con FLUX_REQUIRE_BROKER=1: la comprobación no vigila nada"
            exit 1
          fi
          echo "✓ sin nats-server las pruebas del gateway fallan"
      # La imagen se construye con la raíz como contexto (depende de sdk-node) y arranca con la configuración de ejemplo validada.
      - name: La imagen del gateway se construye y valida una configuración
        run: |
          docker build -f gateway/Dockerfile -t flux-gateway .
          docker run --rm \
            -v "$PWD/gateway/examples/gateway.json:/etc/flux/gateway.json:ro" \
            -e TIENDA_WEB_NKEY_SEED=x -e CATALOGO_WEB_NKEY_SEED=x -e PASARELA_WEB_NKEY_SEED=x \
            -e TIENDA_WEB_ENTREGA_SECRETO=x -e PASARELA_HOOK_SECRETO=x -e GITHUB_HOOK_SECRETO=x \
            flux-gateway --check --config /etc/flux/gateway.json

  # «Una prueba que pasa con el código roto no vale»: cada garantía importante del gateway (comparar el token con ===, no verificar el
  # HMAC, id aleatorio en el webhook, firmar sin el instante, no renovarlo en los reintentos, un 4xx que se reintenta, `data` en los
  # registros, una identidad NATS compartida…) se ROMPE en una copia de src/ y sus pruebas DEBEN fallar. Son decenas y los de extremo a
  # extremo arrancan un broker: se reparten en tres trabajos para no alargar el feedback del resto.
  gateway-mutantes:
    name: Los mutantes del gateway DEBEN hacer fallar las pruebas (${{ matrix.parte }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: sdk-node
      - run: npm ci --no-audit --no-fund
        working-directory: conformance
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - run: npm ci --no-audit --no-fund
        working-directory: gateway
      - name: Mutantes, parte ${{ matrix.parte }} de 3
        working-directory: gateway
        env:
          FLUX_REQUIRE_BROKER: '1'
          FLUX_TEST_PORTS: 6900-6999
        run: node test/mutantes.mjs --parte ${{ matrix.parte }}/3

  # Los tests de estos SDKs LEEN protocol.json para no divergir de la spec. Eso es
  # deliberado, pero significa que un cambio en protocol.json puede romperlos — y
  # pasó: renombrar `syscallCodes` a `syscallCodesExample` tumbó tres tests de Python
  # que nadie ejecutó hasta días después, porque el CI solo corría Node.

  sdk-python:
    name: SDK Python — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `cryptography` es un extra OPCIONAL del SDK (la firma es una extensión
      # opcional de v1), pero en CI se instala a propósito: si no, los tests de firma
      # se saltan y el CI daría verde sin haberlos ejecutado NUNCA.
      - run: pip install pytest cryptography
      - run: python -m pytest sdk-python/tests -q
      # Y sin el extra: el resto de la suite DEBE seguir pasando, saltando solo la
      # firma. Una dependencia opcional que rompe la recolección entera no es opcional.
      - name: La suite pasa también SIN el extra de firma
        run: |
          pip uninstall -y cryptography
          python -m pytest sdk-python/tests -q

  sdk-go:
    name: SDK Go — vet, test, gofmt y NATS real con los permisos que genera gen-acl.mjs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v4
      # Las pruebas de integración montan el entorno de la suite de seguridad (testenv_test.go): un nats-server con TLS, los
      # permisos que genera `scripts/gen-acl.mjs` y `flux provision` (CLI de Node). Un broker abierto no prueba nada de seguridad.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: cli
      # nats-server 2.14.5 exige Go 1.25 (su go.mod): se compila la versión exacta que la spec dice haber medido, igual que en
      # `acl-verify` y `security`. Las pruebas del SDK corren después con Go 1.22, el mínimo que declara su go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        working-directory: .
        run: |
          GOBIN="$PWD/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          echo "NATS_SERVER=$PWD/bin/nats-server" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: go vet ./...
      # FLUX_REQUIRE_BROKER=1: que falte nats-server, node o la CLI es un FALLO y no un salto con aviso. Sin ella, las pruebas de
      # seguridad se saltarían en silencio y el job quedaría verde sin haber ejecutado nunca los permisos contra un broker.
      - name: Pruebas (con un nats-server real, TLS y los permisos generados)
        env:
          FLUX_REQUIRE_BROKER: '1'
        run: go test -race -count=1 ./...
      - name: gofmt sin cambios pendientes
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # En los dos sentidos también aquí: sin nats-server, las pruebas con broker DEBEN fallar y no saltarse.
      - name: Sin nats-server, las pruebas con broker FALLAN (no se saltan)
        run: |
          if NATS_SERVER=/no/existe/nats-server FLUX_REQUIRE_BROKER=1 go test -count=1 -run 'TestSeguridad' ./... > /dev/null 2>&1; then
            echo "✗ las pruebas de seguridad pasaron SIN nats-server con FLUX_REQUIRE_BROKER=1: la comprobación no vigila nada"
            exit 1
          fi
          echo "✓ sin nats-server las pruebas con broker fallan"

  sdk-java:
    name: SDK Java — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Aquí sí hay Maven, a diferencia de la máquina donde se escribió el SDK.
      - run: mvn -B -q -f sdk-java/pom.xml test

  sdk-dotnet:
    name: SDK .NET — build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build sdk-dotnet/Flux.sln
      - run: dotnet test sdk-dotnet/Flux.sln

  sdk-php:
    name: SDK PHP — lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # `sodium` es tan obligatoria como `sockets`: sin ella los ~38 tests de firma
          # se SALTAN y el CI daría verde sin haberlos ejecutado nunca. Un test que se
          # salta en silencio es peor que uno que no existe: aparenta cobertura.
          extensions: json, sockets, sodium
          coverage: none
      - run: composer validate --no-check-lock
      - run: composer install --no-interaction --prefer-dist
      # `php -l` sobre todo el árbol antes de PHPUnit: un error de sintaxis debe reportarse
      # como tal y no como una suite entera que no arranca.
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      # `sockets` va en las extensiones del job para que NO se salte el test que traduce
      # SOCKET_ECONNRESET a "ECONNRESET" por nombre de constante — es justo el mecanismo
      # que evita que el mismo corte de red se clasifique distinto en Linux y en Windows.
      # `--fail-on-skipped`: en CI todas las extensiones están, así que un test saltado
      # significa que falta una y la cobertura sería ficticia. En local es correcto que
      # se salten; en CI, no.
      # `--exclude-group integration`: esos tests necesitan el broker, que aun no esta
      # levantado en este punto. Sin excluirlos se saltan, y `--fail-on-skipped` —que
      # existe para que una extension ausente no pase por cobertura— los tomaria por un
      # fallo. Se ejecutan mas abajo, con NATS ya en pie.
      - run: vendor/bin/phpunit --exclude-group integration,sin-libreria-nats --fail-on-skipped

      # El adaptador de NATS contra un broker REAL. Estuvo sin verificar y escondia un
      # bug de raiz que los tests con cliente falso no podian ver: el mensaje se
      # entregaba y nunca llegaba al handler. Sin este paso, vuelve a pudrirse.
      - name: Levantar NATS con JetStream
        run: |
          docker run -d --name flux-nats-php -p 4222:4222 -p 8222:8222             nats:2.14-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "NATS no arranco"; docker logs flux-nats-php; exit 1
      # ⚠️ EL ORDEN IMPORTA y no es casual. `basis-company/nats` se instala DESPUES de
      # la suite principal a proposito: hay un test que solo corre cuando la libreria NO
      # esta —comprueba que sin ella las cabeceras no se pierden en silencio— y se salta
      # en cuanto se instala. Instalarla antes lo dejaria saltado, y `--fail-on-skipped`
      # tomaria por fallo algo correcto.
      #
      # Asi se prueban las DOS configuraciones en la misma ejecucion: sin la libreria (el
      # camino de reserva) y con ella (la integracion real).
      - run: composer require --dev --no-interaction --no-progress basis-company/nats
      - run: vendor/bin/phpunit --group integration --fail-on-skipped

  sdk-rust:
    name: SDK Rust — fmt, clippy, MSRV y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `signing` y `validation` van detrás de feature: sin esto el README llama L3 a Rust y
      # CI nunca compilaría —ni probaría— el código que lo hace L3.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # `rust-version` es una afirmación («este crate compila con X») y ningún job la
      # ejecutaba: CI usa `stable`, así que nadie notó que `1.83` llevaba tiempo siendo falso
      # (`async-nats` 0.50 exige 1.88). Se LEE de Cargo.toml en vez de repetirla aquí, para que
      # la declaración y su comprobación no puedan separarse: subirla o bajarla sin que las
      # dependencias lo respalden rompe este paso.
      #
      # Se instala con `rustup` y no con un segundo `dtolnay/rust-toolchain`: esa acción fija
      # el toolchain como DEFAULT y los `cargo test` de más abajo pasarían a correr con el
      # mínimo en vez de con `stable`. `+<versión>` lo usa solo este paso, y con un target
      # aparte para no mezclar artefactos de dos compiladores con los de los tests.
      #
      # Las dos invocaciones, por lo mismo que clippy: sin features se compila otro código
      # (los stubs `#[cfg(not(feature = ...))]`), y que uno pase no implica que pase el otro.
      - name: MSRV — cargo check con el toolchain de `rust-version`
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/msrv-target
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "✗ Cargo.toml no declara rust-version"; exit 1; }
          echo "rust-version declarada: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --all-targets
          cargo "+$msrv" check --all-targets --all-features
      # `tests/security.rs` arranca su PROPIO nats-server con ACLs (no sirve el contenedor de
      # abajo, que no tiene usuarios ni TLS). Se compila desde la fuente porque no hay Docker
      # en todos los entornos donde se desarrolla, y fijar la versión es fijar la semántica del
      # broker que las ACLs asumen. v2.14.5 exige Go 1.25 en su go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compilar nats-server 2.14.5
        run: |
          GOBIN="$GITHUB_WORKSPACE/bin" go install github.com/nats-io/nats-server/v2@v2.14.5
          "$GITHUB_WORKSPACE/bin/nats-server" --version
      # Los tests de integración necesitan un NATS con JetStream.
      - name: Levantar NATS con JetStream
        run: |
          docker run -d --name flux-nats-rust -p 4222:4222 -p 8222:8222             nats:2.14-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "NATS no arrancó"; docker logs flux-nats-rust; exit 1
      # FLUX_REQUIRE_BROKER=1: sin broker los tests de integración y de seguridad FALLAN en vez
      # de saltarse con un aviso. Un job verde que no ejecutó nada aparenta cobertura.
      - name: Tests (sin features)
        env:
          NATS_SERVER: ${{ github.workspace }}/bin/nats-server
          FLUX_REQUIRE_BROKER: '1'
        run: cargo test
      - name: Tests (--all-features)
        env:
          NATS_SERVER: ${{ github.workspace }}/bin/nats-server
          FLUX_REQUIRE_BROKER: '1'
        run: cargo test --all-features

  cross-sdk:
    name: Conformidad cruzada entre SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'json, sockets, sodium', coverage: none }

      - name: Preparar los SDKs
        run: |
          (cd sdk-node && npm install --no-audit --no-fund && npm run build)
          pip install cryptography
          (cd sdk-php && composer install --no-interaction --prefer-dist)
          # javac + jar en sdk-java/target/harness. Se reconstruye SIEMPRE y no se versiona:
          # un jar versionado se quedaría atrás respecto al SDK y el runner compararía bytes
          # de un código que ya no existe.
          node conformance/harness/build-java.mjs
          # `dotnet run` compilaría igualmente en la primera operación, pero el restore y el
          # saludo de primera ejecución del CLI van a STDOUT, donde el contrato dice que solo
          # va el JSON del arnés. Se sacan de en medio aquí.
          dotnet build sdk-dotnet/Flux.sln -v quiet

      # No necesita broker: esto ejercita envelope, firma, parseo, estado y petición/respuesta, no NATS.
      # Compara las salidas de los siete SDKs BYTE A BYTE con los mismos vectores. Las operaciones de una
      # CAPACIDAD (state-*, rpc-*) las ejecuta cada SDK que la declara en protocol.json → capabilities, y
      # FALLA el que la declara y no las cumple (bytes distintos, un código distinto, una operación que su
      # arnés no implementa, un arnés sin registrar). `--exigir state,rpc` añade que el job no pueda quedar
      # verde con un «N/A» en todos: si ningún SDK ejecutó la capacidad, falla.
      - name: Vectores idénticos en todos los SDKs
        run: node conformance/cross-sdk.mjs --verbose --exigir state,rpc

      # Los 93 vectores de «Ajustes» (conformance/harness/vectors.json → ajustesVectors): lo que se decidió donde la
      # spec callaba o discrepaba (dlqerror en bytes, `maxLength` en puntos de código, versión mayor de 1 a 4
      # dígitos, `id`/`source` vacíos, `time` canónico, `data` canónico). Son de CUALQUIER operación de estado o de
      # rpc y de dos SDKs (`ajustesSdks`), por eso los ejecuta su propio runner y no cross-sdk.mjs.
      - name: Los ajustes (93 vectores) dan lo decidido en Node y Rust
        run: node conformance/ajustes.mjs

      # Las operaciones de estado (state-build, state-tombstone, state-subject, state-dlq) y de petición/respuesta
      # (rpc-request, rpc-reply, rpc-error, rpc-operation, rpc-timeout) las ejecutan SOLO los SDKs que declaran
      # `state` o `rpc` en protocol.json (Node y Rust): los otros cinco salen «N/A: no declara …» en el paso de
      # arriba. Un runner que solo se ha visto en verde no demuestra que detecte nada: cada mutante estropea a
      # propósito lo que un SDK entrega o declara (un byte, un tenant, un timeout fuera de rango aceptado, un
      # dominio reservado que no se rechaza, un `correlationid` que no se hereda, una operación ausente, un arnés
      # sin registrar) y el runner DEBE fallar. Con `--only` para no recompilar ni invocar lo que el mutante no toca.
      - name: El runner detecta un byte, un tenant, un timeout, un dominio reservado o una operación ausente (debe FALLAR)
        run: |
          for par in rust-un-byte:node,rust rust-tenant-cambiado:node,rust rust-ignora-tenant:node,rust \
                     rust-sin-state-subject:node,rust rust-sin-arnes-registrado:node,rust \
                     python-declara-state:node,python \
                     rust-rpc-un-byte:node,rust rust-rpc-timeout-recortado:node,rust \
                     rust-rpc-dominio-reservado-aceptado:node,rust rust-rpc-correlationid-de-la-peticion:node,rust \
                     rust-sin-rpc-operation:node,rust python-declara-rpc:node,python; do
            mutante="${par%%:*}"
            solo="${par#*:}"
            # Debe terminar con 1 (una divergencia detectada), no con 2: un mutante mal escrito, o unos vectores
            # que ni siquiera se cargan, también «fallan», y no demuestran que el runner vigile nada.
            node conformance/cross-sdk.mjs --only "$solo" --mutant "$mutante" > /dev/null 2>&1 && codigo=0 || codigo=$?
            if [ "$codigo" -ne 1 ]; then
              echo "✗ el mutante $mutante terminó con $codigo y debía fallar con 1: el runner no vigila lo que dice vigilar"
              exit 1
            fi
            echo "✓ $mutante detectado"
          done

      # El reverso: un SDK que NO declara una capacidad no es un fallo, pero tampoco un salto silencioso.
      - name: Un SDK que no declara state ni rpc sale N/A y NO falla
        run: |
          for cap in state rpc; do
            salida=$(node conformance/cross-sdk.mjs --only node,rust --mutant "rust-no-declara-$cap")
            echo "$salida" | grep -q "N/A: no declara $cap — rust" || { echo "✗ no imprimió el N/A de $cap"; exit 1; }
            echo "✓ $cap: N/A visible y sin fallo"
          done

  conformance:
    name: Conformidad contra NATS real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Contra un NATS de verdad, no un mock: la suite existe precisamente porque
      # las suposiciones sobre el broker resultaron falsas al comprobarlas.
      # Se levanta con `docker run` y no con `services:` porque la imagen oficial no
      # arranca JetStream por defecto y `services:` no permite sobrescribir el command.
      - name: Levantar NATS con JetStream
        run: |
          docker run -d --name flux-nats -p 4222:4222 -p 8222:8222 \
            nats:2.14-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "✓ NATS listo"; exit 0
            fi
            sleep 1
          done
          echo "✗ NATS no arrancó"; docker logs flux-nats; exit 1

      - name: Ejecutar suite de conformidad
        working-directory: conformance
        run: |
          npm install --no-audit --no-fund
          npm test

      # `flux doctor` sale con 1 si encuentra errores, así que se prueba en ambos
      # sentidos: un cluster conforme pasa, y uno con el bug del ack_wait sembrado
      # DEBE fallar. Un doctor que solo se prueba en verde no demuestra nada.
      - name: flux doctor detecta un cluster roto
        working-directory: cli
        run: |
          npm install --no-audit --no-fund
          node src/index.mjs validate pedidos.pedido.v1.creado
          ! node src/index.mjs validate 'Pedidos.pedido.v1.actualizado'
          node -e "
            const {connect} = await import('@nats-io/transport-node');
            const {jetstreamManager} = await import('@nats-io/jetstream');
            const nc = await connect({servers:'nats://127.0.0.1:4222'});
            const jsm = await jetstreamManager(nc); const S=1e9;
            await jsm.streams.add({name:'EVT_CITEST',subjects:['citest.>'],storage:'file',
              retention:'limits',discard:'old',max_age:30*86400*S,duplicate_window:120*S});
            await jsm.streams.add({name:'DLQ_CITEST',subjects:['dlq.citest.>'],storage:'file',
              retention:'limits',discard:'old',max_age:90*86400*S});
            await jsm.consumers.add('EVT_CITEST',{durable_name:'ok-api__citest_p_v1_creado',
              filter_subject:'citest.p.v1.creado',ack_policy:'explicit',ack_wait:30*S,
              max_deliver:6,backoff:[30*S,60*S,300*S,900*S,1800*S],max_ack_pending:256});
            await nc.drain();
          " --input-type=module
          echo '--- cluster conforme: doctor debe salir 0 ---'
          node src/index.mjs doctor
          node -e "
            const {connect} = await import('@nats-io/transport-node');
            const {jetstreamManager} = await import('@nats-io/jetstream');
            const nc = await connect({servers:'nats://127.0.0.1:4222'});
            const jsm = await jetstreamManager(nc); const S=1e9;
            await jsm.consumers.add('EVT_CITEST',{durable_name:'roto-api__citest_p_v1_creado',
              filter_subject:'citest.p.v1.creado',ack_policy:'explicit',ack_wait:30*S,
              max_deliver:6,backoff:[1*S,5*S,30*S,120*S,600*S]});
            await nc.drain();
          " --input-type=module
          echo '--- ack_wait sembrado a 1s: doctor DEBE salir 1 ---'
          ! node src/index.mjs doctor
