name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  llms-up-to-date:
    name: llms-full.txt al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin esto, llms-full.txt diverge de specification/ en la primera semana,
      # y un agente que carga documentación obsoleta actúa con confianza sobre
      # reglas que ya no existen — peor que no cargar ninguna.
      - name: Verificar que el agregado está regenerado
        run: node scripts/build-llms.mjs --check

  schemas-valid:
    name: Schemas válidos e inmutables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 05-compatibility.md §5: "Sin (1) y (2) automatizados, el resto de este
      # documento es una sugerencia amable." Esto es (1) y (2).
      - name: Esquemas conformes y BACKWARD-compatibles
        run: node scripts/check-compat.mjs -v

      # El bundle es lo que los servicios L3 despliegan: si diverge de schemas/,
      # un servicio valida contra un contrato que ya no existe.
      - name: bundle.json al día
        run: node scripts/bundle-schemas.mjs --check

      # 05-compatibility.md §4: los esquemas publicados son inmutables.
      # Editar 1.0.0 in situ invalida todos los eventos ya emitidos que lo referencian.
      - name: Ningún schema existente modificado
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status \
            origin/${{ github.base_ref }}...HEAD -- schemas/ \
            | awk '$1 == "M" || $1 ~ /^R/ { print $2 }')
          if [ -n "$changed" ]; then
            echo "✗ Schemas publicados modificados (son inmutables — añade una versión nueva):"
            echo "$changed"
            exit 1
          fi
          echo "✓ Solo adiciones"

  acl-manifest:
    name: Manifiesto de ownership coherente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Un dominio con dos dueños destruye la premisa de que solo el propietario
      # del agregado publica sus eventos, y nadie puede confiar ya en el .
      - run: node scripts/gen-acl.mjs examples/services.json --check

  protocol-json-valid:
    name: protocol.json coherente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No basta con que sea JSON válido: un patrón con las barras invertidas comidas
      # sigue compilando y rechaza TODO lo que debería aceptar. Pasó de verdad.
      - run: node scripts/check-protocol-json.mjs

  sdk-node:
    name: SDK Node — typecheck y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Los tests de estos SDKs LEEN protocol.json para no divergir de la spec. Eso es
  # deliberado, pero significa que un cambio en protocol.json puede romperlos — y
  # pasó: renombrar `syscallCodes` a `syscallCodesExample` tumbó tres tests de Python
  # que nadie ejecutó hasta días después, porque el CI solo corría Node.

  sdk-python:
    name: SDK Python — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest sdk-python/tests -q

  sdk-go:
    name: SDK Go — vet, test y gofmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt sin cambios pendientes
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  sdk-java:
    name: SDK Java — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Aquí sí hay Maven, a diferencia de la máquina donde se escribió el SDK.
      - run: mvn -B -q -f sdk-java/pom.xml test

  sdk-dotnet:
    name: SDK .NET — build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build sdk-dotnet/Flux.sln
      - run: dotnet test sdk-dotnet/Flux.sln

  sdk-php:
    name: SDK PHP — lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sockets
          coverage: none
      - run: composer validate --no-check-lock
      - run: composer install --no-interaction --prefer-dist
      # `php -l` sobre todo el árbol antes de PHPUnit: un error de sintaxis debe reportarse
      # como tal y no como una suite entera que no arranca.
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      # `sockets` va en las extensiones del job para que NO se salte el test que traduce
      # SOCKET_ECONNRESET a "ECONNRESET" por nombre de constante — es justo el mecanismo
      # que evita que el mismo corte de red se clasifique distinto en Linux y en Windows.
      - run: vendor/bin/phpunit

  sdk-rust:
    name: SDK Rust — fmt, clippy y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Los tests de integración necesitan un NATS con JetStream.
      - name: Levantar NATS con JetStream
        run: |
          docker run -d --name flux-nats-rust -p 4222:4222 -p 8222:8222             nats:2.14-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "NATS no arrancó"; docker logs flux-nats-rust; exit 1
      - run: cargo test

  sdk-php:
    name: SDK PHP — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # `sockets` no es opcional: sin ella se salta el test que traduce
          # SOCKET_ECONNRESET por NOMBRE de constante, y ese es justo el que evita que
          # el mismo corte de red se clasifique distinto en Windows (10054) y Linux (104).
          extensions: json, sockets
          coverage: none
      - run: composer validate --no-check-lock
      - run: composer install --no-interaction --prefer-dist
      # `php -l` sobre todo el árbol antes de phpunit: un error de sintaxis debe
      # reportarse como tal y no como 201 tests que no arrancan.
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit

  conformance:
    name: Conformidad contra NATS real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Contra un NATS de verdad, no un mock: la suite existe precisamente porque
      # las suposiciones sobre el broker resultaron falsas al comprobarlas.
      # Se levanta con `docker run` y no con `services:` porque la imagen oficial no
      # arranca JetStream por defecto y `services:` no permite sobrescribir el command.
      - name: Levantar NATS con JetStream
        run: |
          docker run -d --name flux-nats -p 4222:4222 -p 8222:8222 \
            nats:2.14-alpine --jetstream --http_port=8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "✓ NATS listo"; exit 0
            fi
            sleep 1
          done
          echo "✗ NATS no arrancó"; docker logs flux-nats; exit 1

      - name: Ejecutar suite de conformidad
        working-directory: conformance
        run: |
          npm install --no-audit --no-fund
          npm test

      # `flux doctor` sale con 1 si encuentra errores, así que se prueba en ambos
      # sentidos: un cluster conforme pasa, y uno con el bug del ack_wait sembrado
      # DEBE fallar. Un doctor que solo se prueba en verde no demuestra nada.
      - name: flux doctor detecta un cluster roto
        working-directory: cli
        run: |
          npm install --no-audit --no-fund
          node src/index.mjs validate pedidos.pedido.v1.creado
          ! node src/index.mjs validate 'Pedidos.pedido.v1.actualizado'
          node -e "
            const {connect} = await import('@nats-io/transport-node');
            const {jetstreamManager} = await import('@nats-io/jetstream');
            const nc = await connect({servers:'nats://127.0.0.1:4222'});
            const jsm = await jetstreamManager(nc); const S=1e9;
            await jsm.streams.add({name:'EVT_CITEST',subjects:['citest.>'],storage:'file',
              retention:'limits',discard:'old',max_age:30*86400*S,duplicate_window:120*S});
            await jsm.streams.add({name:'DLQ_CITEST',subjects:['dlq.citest.>'],storage:'file',
              retention:'limits',discard:'old',max_age:90*86400*S});
            await jsm.consumers.add('EVT_CITEST',{durable_name:'ok-api__citest_p_v1_creado',
              filter_subject:'citest.p.v1.creado',ack_policy:'explicit',ack_wait:30*S,
              max_deliver:6,backoff:[30*S,60*S,300*S,900*S,1800*S],max_ack_pending:256});
            await nc.drain();
          " --input-type=module
          echo '--- cluster conforme: doctor debe salir 0 ---'
          node src/index.mjs doctor
          node -e "
            const {connect} = await import('@nats-io/transport-node');
            const {jetstreamManager} = await import('@nats-io/jetstream');
            const nc = await connect({servers:'nats://127.0.0.1:4222'});
            const jsm = await jetstreamManager(nc); const S=1e9;
            await jsm.consumers.add('EVT_CITEST',{durable_name:'roto-api__citest_p_v1_creado',
              filter_subject:'citest.p.v1.creado',ack_policy:'explicit',ack_wait:30*S,
              max_deliver:6,backoff:[1*S,5*S,30*S,120*S,600*S]});
            await nc.drain();
          " --input-type=module
          echo '--- ack_wait sembrado a 1s: doctor DEBE salir 1 ---'
          ! node src/index.mjs doctor
